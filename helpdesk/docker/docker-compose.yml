services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: helpdesk
      POSTGRES_PASSWORD: helpdesk
      POSTGRES_DB: helpdesk
    ports:
      - "5432:5432"
    volumes:
      - helpdesk_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U helpdesk"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../backend
    environment:
      HELPDESK_DATABASE_URL: postgresql+asyncpg://helpdesk:helpdesk@db:5432/helpdesk
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  helpdesk_db_data:
