[project]
name = "helpdesk-backend"
version = "0.1.0"
description = "Global IT helpdesk ticket system - backend API (Phase 1 MVP)"
requires-python = ">=3.11"

dependencies = [
    "fastapi[standard]~=0.116",
    "sqlalchemy[asyncio]~=2.0",
    "aiosqlite~=0.21",
    "asyncpg~=0.30",
    "pydantic-settings~=2.12.0",
    "uvicorn~=0.35",
]

[dependency-groups]
dev = [
    "pytest~=8.3",
    "pytest-asyncio~=0.24",
    "httpx~=0.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
